# Takagi Configuration Example
# Place this file as takagi.yml in your project root

# ============================================
# Server Settings
# ============================================
port: 5683
bind_address: "0.0.0.0"  # Bind to all interfaces (default)
                          # Use "127.0.0.1" for local-only
                          # Use specific IP for single interface
server_name: "Takagi CoAP Server"

# Worker processes. A server-wide DEFAULT, consumed by UDP only: a protocol
# forks workers from its own `protocol_settings` count below.
processes: 1

# Threads per serving process. UDP readers take this value; the TCP handler
# pool opens only on `protocol_settings: { tcp: { threads: N } }` below.
threads: 4

# Accepted-connection cap per TCP worker (`worker_processes x this` is the
# server ceiling). UDP has no accepted-connection notion.
max_connections: 100

# Per-protocol overrides: a written key wins for its own transport.
protocol_settings:
  udp:
    processes: 1
  tcp:
    processes: 2         # 2 forked TCP workers behind one port
    threads: 4           # bounded handler pool, per worker
    max_connections: 50  # per worker

# Supported protocols
protocols:
  - udp
  - tcp

# ============================================
# Logger Configuration
# ============================================
logger:
  level: info  # debug, info, warn, error
  output: stdout

# ============================================
# Observability
# ============================================
observability:
  backends:
    - memory
    # - prometheus  # Uncomment for Prometheus metrics
    # - statsd      # Uncomment for StatsD metrics

# ============================================
# EventBus Configuration
# ============================================
event_bus:
  # Threads that run subscribers registered with `async: true`.
  # Each subscriber still receives its messages in publication order.
  async_threads: 10

  # Per-subscriber backlog bound. A post that would exceed it is refused and logged.
  async_backlog_limit: 1024

  # Observer cleanup settings
  # Removes stale CoAP observers periodically (read by Observer::Registry)
  cleanup_interval: 60     # Seconds between cleanup runs
  max_observer_age: 600    # Seconds (10 minutes)

  # NOTE: the bus keeps no event state and offers no buffering.
  # Old keys (ractors, state_cache_size, state_cache_ttl, message_buffering_enabled,
  # message_buffer_max_messages, message_buffer_ttl) now raise an ArgumentError on load.

# ============================================
# Router Configuration
# ============================================
router:
  # Default Content-Format when not specified
  # 0  = text/plain
  # 40 = application/link-format
  # 41 = application/xml
  # 42 = application/octet-stream
  # 50 = application/json (default)
  # 60 = application/cbor
  default_content_format: 50

# ============================================
# Middleware Configuration
# ============================================
middleware:
  # Enable/disable middleware globally
  enabled: true

  # Middleware stack (executed in order)
  # Middleware wraps request/response processing
  # First middleware in list runs first (outermost layer)
  stack:
    # Simple middleware (no options)
    - Logging

    # Middleware with options
    - name: Caching
      options:
        ttl: 300  # Cache TTL in seconds

    # Available built-in middleware:
    # - Debugging: Debug logging for requests/responses
    # - Logging: Request/response logging
    # - Caching: Simple in-memory cache
    # - RateLimiting: Rate limit requests (options: max_requests, window)
    # - Metrics: Collect metrics (options: backend)
    # - Authentication: Token-based auth (options: tokens, realm)

    # Example: Rate Limiting
    # - name: RateLimiting
    #   options:
    #     max_requests: 100
    #     window: 60  # seconds

    # Example: Authentication
    # - name: Authentication
    #   options:
    #     tokens:
    #       - "secret-token-1"
    #       - "secret-token-2"
    #     realm: "CoAP API"

    # Example: Custom middleware (full class name)
    # - name: MyApp::CustomMiddleware
    #   options:
    #     custom_option: value

# ============================================
# Custom Application Settings
# ============================================
# Add any custom settings here - accessible via Takagi.config[:key]
custom:
  # Example custom settings
  app_name: "My IoT Application"
  max_devices: 100
  device_timeout: 30